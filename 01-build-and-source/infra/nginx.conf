server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # ALB 헬스체크 전용 — 정적 파일 유무와 무관하게 200을 준다
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Spine .atlas / .skel 은 nginx 기본 mime에 없다. 빠지면 브라우저가
    # 엉뚱한 Content-Type으로 받아 스켈레톤 로딩이 실패한다.
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js;
        application/json                      json;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/webp                            webp;
        image/svg+xml                         svg;
        text/plain                            atlas;
        application/octet-stream              skel;
        font/woff2                            woff2;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # 해시가 붙은 산출물은 영구 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 캐시하지 않는다 — 배포 후 구버전이 남으면 안 된다
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
